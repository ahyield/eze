<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{SITE}}</title>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --card: #fff; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0a09; --fg: #f5f5f4; --muted: #a8a29e; --line: #292524; --card: #1c1917; --accent: #60a5fa; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  h1 { margin: 0 0 4px; letter-spacing: -0.02em; }
  .muted { color: var(--muted); }
  form { display: flex; gap: 8px; margin: 24px 0; }
  input { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: inherit; font: inherit; }
  button { padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 12px 0; border-bottom: 1px solid var(--line); }
  li small { display: block; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>{{SITE}}</h1>
  <p class="muted" id="hello">A live guestbook. Edit index.html, or ask your coding agent to replace it.</p>
  <form id="sign">
    <input id="message" placeholder="Leave a message" maxlength="280" autocomplete="off" required>
    <button>Sign</button>
  </form>
  <ul id="entries"></ul>
</main>

<script src="/_eze/sdk.js"></script>
<script>
  const entries = eze.db.collection('guestbook');
  const list = document.getElementById('entries');

  function render(doc) {
    const li = document.createElement('li');
    li.dataset.id = doc.id;
    li.textContent = doc.message;
    const meta = document.createElement('small');
    meta.textContent = doc.name + ' · ' + new Date(doc._created_at).toLocaleString();
    li.append(meta);
    list.prepend(li);
  }

  async function load() {
    list.replaceChildren();
    (await entries.list({ order: 'asc', limit: 200 })).forEach(render);
  }

  eze.id.me().then((me) => {
    document.getElementById('hello').textContent = 'Hi ' + me.name + '. Sign the guestbook, everyone here sees it live.';
  });

  document.getElementById('sign').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('message');
    const me = await eze.id.me();
    await entries.create({ message: input.value, name: me.name });
    input.value = '';
  });

  load();
  entries.subscribe({
    onCreate: render,
    onDelete: (id) => list.querySelector(`[data-id="${id}"]`)?.remove(),
    onReconnect: load,
  });
</script>
</body>
</html>
