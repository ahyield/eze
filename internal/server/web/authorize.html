<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorize CLI</title>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --card: #fff; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0a09; --fg: #f5f5f4; --muted: #a8a29e; --line: #292524; --card: #1c1917; --accent: #3b82f6; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 32px; max-width: 400px; width: 100%; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  button { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <form class="card" method="post" action="/_q/cli/authorize">
    <h1>Sign in the eze CLI?</h1>
    <p>The CLI on your computer will be able to deploy and delete sites as <strong>{{.User.Email}}</strong>. Only continue if you just ran <code>eze login</code>.</p>
    <input type="hidden" name="port" value="{{.Port}}">
    <input type="hidden" name="state" value="{{.State}}">
    <button type="submit">Authorize</button>
  </form>
</body>
</html>
