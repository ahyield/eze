name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: docker build -t eze .
      - name: docker smoke test
        run: |
          docker volume create eze-data
          docker run -d --name eze -p 8080:8080 -v eze-data:/data -e EZE_DOMAIN=localhost:8080 -e EZE_AUTH=header eze
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && exit 0; sleep 1; done
          docker logs eze
          exit 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -o eze ./cmd/eze
      - name: start Garage (S3) and a fake Google Cloud Storage server
        run: |
          cat > garage.toml <<TOML
          metadata_dir = "/var/lib/garage/meta"
          data_dir = "/var/lib/garage/data"
          db_engine = "sqlite"
          replication_factor = 1
          rpc_bind_addr = "[::]:3901"
          rpc_public_addr = "127.0.0.1:3901"
          rpc_secret = "$(openssl rand -hex 32)"
          [s3_api]
          s3_region = "garage"
          api_bind_addr = "[::]:3900"
          TOML
          docker run -d --name garage -p 127.0.0.1:3900:3900 -v "$PWD/garage.toml:/etc/garage.toml" dxflrs/garage:v2.4.1
          sleep 3
          garage() { docker exec garage /garage "$@"; }
          node=$(garage status | awk '/NO ROLE ASSIGNED/ {print $1}' | head -1)
          garage layout assign -z dc1 -c 1G "$node"
          garage layout apply --version 1
          garage bucket create eze
          garage key create eze > key.txt
          garage bucket allow --read --write --owner eze --key eze
          echo "AWS_ACCESS_KEY_ID=$(awk '/Key ID/ {print $3}' key.txt)" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$(awk '/Secret key/ {print $3}' key.txt)" >> "$GITHUB_ENV"

          go install github.com/fsouza/fake-gcs-server@v1.56.1
          mkdir -p gcs/eze
          fake-gcs-server -scheme http -host 127.0.0.1 -port 4443 -public-host 127.0.0.1:4443 -backend memory -data gcs &
          sleep 2
      - name: local disk
        run: scripts/storage-smoke.sh ./eze ''
      - name: S3 (Garage)
        run: scripts/storage-smoke.sh ./eze 's3://eze?endpoint=http://127.0.0.1:3900&region=garage&use_path_style=true'
      - name: Google Cloud Storage
        env:
          STORAGE_EMULATOR_HOST: 127.0.0.1:4443
        run: scripts/storage-smoke.sh ./eze gs://eze
