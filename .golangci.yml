version: "2"

linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.Tx).Rollback
        - (*github.com/coder/websocket.Conn).CloseNow
  exclusions:
    # Unchecked Close, os.Remove and fmt.Fprint* errors: best-effort cleanup and writes
    # to a client that may already be gone.
    presets:
      - std-error-handling

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
